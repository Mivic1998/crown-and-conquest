{% extends "base.html" %}

{% block title %}Reset Password | Crown & Conquest{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-panel parchment-panel">
        <p class="eyebrow">Recover access</p>
        <h1>Password Reset</h1>
        <div class="ornate-divider"></div>
        <p class="auth-lead">Enter your email address and a recovery scroll will be sent to you.</p>
        <form method="post" action="{% url 'account_reset_password' %}" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning">Send Reset Email</button>
        </form>
        <p class="auth-alt"><a href="{% url 'account_login' %}">Return to login</a></p>
    </div>
</section>
{% endblock %}
