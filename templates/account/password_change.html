{% extends "base.html" %}

{% block title %}Change Password | Crown & Conquest{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-panel parchment-panel">
        <p class="eyebrow">Royal security</p>
        <h1>Change Password</h1>
        <div class="ornate-divider"></div>
        <form method="post" action="{% url 'account_change_password' %}" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning">Change Password</button>
        </form>
    </div>
</section>
{% endblock %}
