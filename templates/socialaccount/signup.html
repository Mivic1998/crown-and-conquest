{% extends "base.html" %}

{% block title %}Complete Social Signup | Crown & Conquest{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-panel parchment-panel">
        <p class="eyebrow">Complete alliance</p>
        <h1>Complete Sign Up</h1>
        <div class="ornate-divider"></div>
        <p class="auth-lead">Confirm the details below to finish creating your Crown &amp; Conquest account.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning">Complete Sign Up</button>
        </form>
    </div>
</section>
{% endblock %}
