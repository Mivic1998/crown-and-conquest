{% extends "base.html" %}

{% block title %}Social Login | Crown & Conquest{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-panel parchment-panel">
        <p class="eyebrow">Royal alliance</p>
        <h1>Continue with {{ provider.name }}</h1>
        <div class="ornate-divider"></div>
        <p class="auth-lead">You are about to sign in using your {{ provider.name }} account.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning">Continue</button>
            <a href="{% url 'account_login' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
